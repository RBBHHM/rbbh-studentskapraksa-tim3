name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Build & Unit/Integration Tests ──────────────────────────────────────────
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore studentskapraksa.slnx

      - name: Build
        run: dotnet build studentskapraksa.slnx --no-restore --configuration Release

      - name: Unit & Integration Tests
        run: >
          dotnet test studentskapraksa.slnx
          --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName!~E2E"

  # ─── Docker Build Check ───────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t praksa-api .
        continue-on-error: true

      - name: Build Web image
        run: docker build -f docker/web.Dockerfile -t praksa-web .
        continue-on-error: true

  # ─── E2E Tests — PL Order Happy Path ─────────────────────────────────────────
  e2e-tests:
    name: E2E Tests — PL Order Happy Path
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ── Infrastruktura: Postgres + Keycloak ────────────────────────────────────
      - name: Start Postgres + Keycloak
        run: docker compose up -d
        # docker-compose.yml u rootu: postgres + keycloak s realm-export.json (realm=praksa)

      - name: Wait for Postgres
        run: |
          timeout 90 bash -c \
            'until docker exec praksa-postgres pg_isready -U student -d studentskapraksa; \
             do echo "Čekam Postgres..."; sleep 3; done'
          echo "Postgres spreman ✓"

      - name: Wait for Keycloak
        # Keycloak treba 3-5 minuta za cold start + realm import. timeout 300 = 5 min.
        run: |
          timeout 300 bash -c \
            'until curl -sf http://localhost:8080/realms/praksa > /dev/null; \
             do echo "Čekam Keycloak..."; sleep 10; done'
          echo "Keycloak spreman ✓"

      # ── Build ──────────────────────────────────────────────────────────────────
      - name: Restore
        run: dotnet restore studentskapraksa.slnx

      - name: Build (Release)
        run: dotnet build studentskapraksa.slnx --no-restore --configuration Release

      # ── API ────────────────────────────────────────────────────────────────────
      - name: Start API (background)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=studentskapraksa;Username=student;Password=changeme"
          Keycloak__Authority: "http://localhost:8080/realms/praksa"
          Keycloak__Audience: "praksa-api"
          Keycloak__RequireHttpsMetadata: "false"
          Keycloak__ValidIssuers__0: "http://localhost:8080/realms/praksa"
          KeycloakAdmin__BaseUrl: "http://localhost:8080"
          KeycloakAdmin__Realm: "praksa"
          KeycloakAdmin__ClientId: "praksa-api"
          KeycloakAdmin__ClientSecret: "praksa-api-secret-dev"
          KeycloakAdmin__AdminUsername: "admin"
          KeycloakAdmin__AdminPassword: "admin"
          ASPNETCORE_URLS: "http://localhost:5000"
        run: |
          dotnet run --project src/Api/Api.csproj \
            --configuration Release --no-build &
          echo "API PID=$!"

      - name: Wait for API
        run: |
          timeout 120 bash -c \
            'until curl -sf http://localhost:5000/health > /dev/null; \
             do echo "Čekam API..."; sleep 3; done'
          echo "API spreman ✓"

      # ── BlazorApp ─────────────────────────────────────────────────────────────
      - name: Start BlazorApp (background)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          BackendApiUri: "http://localhost:5000"
          OpenIDConnectSettings__Authority: "http://localhost:8080/realms/praksa"
          OpenIDConnectSettings__ClientId: "praksa-web"
          OpenIDConnectSettings__RequireHttpsMetadata: "false"
          KeycloakInternalUrl: "http://localhost:8080/realms/praksa"
          ASPNETCORE_URLS: "http://localhost:5001"
        run: |
          dotnet run --project src/BlazorApp/BlazorApp.csproj \
            --configuration Release --no-build &
          echo "BlazorApp PID=$!"

      - name: Wait for BlazorApp
        run: |
          timeout 120 bash -c \
            'until curl -sf http://localhost:5001/ > /dev/null; \
             do echo "Čekam BlazorApp..."; sleep 3; done'
          echo "BlazorApp spreman ✓"

      # ── Playwright ─────────────────────────────────────────────────────────────
      - name: Install Playwright CLI
        run: dotnet tool install --global Microsoft.Playwright.CLI --version 1.48.0
        continue-on-error: true

      - name: Install Chromium
        run: |
          cd tests/E2E.Tests
          dotnet build --configuration Release --no-restore
          ~/.dotnet/tools/playwright install chromium --with-deps || \
          npx playwright install chromium --with-deps || true

      # ── E2E Tests ─────────────────────────────────────────────────────────────
      - name: Run PL Happy Path E2E test
        env:
          E2E__BaseUrl: "http://localhost:5001"
          E2E__ApiUrl: "http://localhost:5000"
          E2E__KeycloakUrl: "http://localhost:8080"
          E2E__KeycloakRealm: "praksa"
          E2E__KeycloakClientId: "praksa-web"
          E2E_DEMO_MODE: "0"
          PLAYWRIGHT_BROWSERS_PATH: "~/.cache/ms-playwright"
        run: |
          dotnet test tests/E2E.Tests/E2E.Tests.csproj \
            --configuration Release --no-build \
            --filter "PLOrderHappyPathTests" \
            --verbosity normal \
            --logger "console;verbosity=normal"

      # ── Artifacts pri neuspjehu ────────────────────────────────────────────────
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/E2E.Tests/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose down -v
