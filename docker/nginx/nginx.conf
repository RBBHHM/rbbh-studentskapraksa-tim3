# nginx.conf — Produkcijska reverse proxy konfiguracija za Tim3
#
# Deployment: Ovaj fajl se uploaduje na VPS ili koristi unutar Docker nginx kontejnera.
# Varijable ${BASE_DOMAIN} se supstituiraju pri pokretanju kontejnera via envsubst.
#
# SSL certifikati se generišu/obnavljaju putem certbot:
#   certbot certonly --webroot -w /var/www/certbot -d tim3.${BASE_DOMAIN}
#
# Direktoriji certifikata: /etc/letsencrypt/live/tim3.${BASE_DOMAIN}/

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    large_client_header_buffers 4 32k;

    # Gzip kompresija za sve tekstualne odgovore
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # Upstream servisi (imena iz docker-compose.app.yml)
    upstream api_upstream {
        server tim3_api:8080;
        keepalive 32;
    }

    upstream web_upstream {
        server tim3_web:8080;
        keepalive 32;
    }

    # ── HTTP (port 80) — redirect na HTTPS + certbot verification ────────────────
    server {
        listen 80;
        server_name tim3.${BASE_DOMAIN};

        # Let's Encrypt webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Sve ostalo → HTTPS redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (port 443) — główna konfiguracija ──────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name tim3.${BASE_DOMAIN};

        # Let's Encrypt certifikati
        ssl_certificate     /etc/letsencrypt/live/tim3.${BASE_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tim3.${BASE_DOMAIN}/privkey.pem;

        # SSL/TLS best practices (Mozilla Intermediate compatibility)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS (1 godina, uključuje subdomene)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Sigurnosni headeri
        add_header X-Content-Type-Options   "nosniff"          always;
        add_header X-Frame-Options          "SAMEORIGIN"       always;
        add_header Referrer-Policy          "strict-origin"    always;

        # ── Auth rute — Blazor web (ROPC login, logout, OIDC callback) ────────────
        # Veliki bufferi jer Set-Cookie header sadrži JWT token
        location /api/auth/ {
            proxy_pass             http://web_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_buffer_size      32k;
            proxy_buffers          8 32k;
            proxy_busy_buffers_size 64k;
        }

        location = /api/login {
            proxy_pass             http://web_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_buffer_size      32k;
            proxy_buffers          8 32k;
            proxy_busy_buffers_size 64k;
        }

        location = /api/logout {
            proxy_pass             http://web_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_buffer_size      32k;
            proxy_buffers          8 32k;
            proxy_busy_buffers_size 64k;
        }

        location /authentication/ {
            proxy_pass             http://web_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_buffer_size      32k;
            proxy_buffers          8 32k;
            proxy_busy_buffers_size 64k;
        }

        # ── Backend API ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;

            # Upload fajlova — veći limit za PDF dokumente
            client_max_body_size 15M;
        }

        # Health check (ne zahtijeva autentifikaciju)
        location /health {
            proxy_pass http://api_upstream;
            access_log off;
        }

        # ── Blazor Server (SignalR + WebSocket) ───────────────────────────────────
        location / {
            proxy_pass              http://web_upstream;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade           $http_upgrade;
            proxy_set_header        Connection        "upgrade";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_buffer_size       32k;
            proxy_buffers           8 32k;
            proxy_busy_buffers_size 64k;
            proxy_read_timeout      3600s;  # SignalR veze su dugotrajne
        }
    }
}
