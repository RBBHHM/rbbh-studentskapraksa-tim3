# Tim3 — app sloj za dijeljeni VPS (Model A, vidi ARHITEKTURA.md).
# Samo naš web + api, priključeni na VANJSKU mrežu `shared-infra`. Bazu (Postgres),
# Keycloak i nginx drži vlasnik servera — mi ih dosežemo po imenu kontejnera.
#
# Pokretanje (env fajl je pored compose-a, pa eksplicitno --env-file):
#   docker compose -f docker/docker-compose.app.yml --env-file docker/.env.app up -d --build
#
# VAŽNO: "name:" ispod eksplicitno izoluje Compose "project" za tim3. Bez ovoga,
# Compose izvodi project ime iz direktorija compose fajla ("docker") — a više
# timova na ovom dijeljenom serveru koristi identičan relativni put
# docker/docker-compose.app.yml, pa bi bez eksplicitnog imena Compose grupisao
# tim3 kontejnere pod ISTI "docker" project sa drugim timovima. `--remove-orphans`
# bi u tom slučaju mogao obrisati tuđe kontejnere. NE UKLANJATI.
name: praksa-tim3

services:
  tim3_api:                                  # prefiks "tim3_" da se na shared-infra ne sudara s drugim timovima
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: tim3_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"                     # sluša interno na 8080 (ne izlažemo na host)
      DOTNET_gcServer: "0"                              # Workstation GC — drastično manje RAM-a (ARHITEKTURA §4.6)
      # Naša baza/korisnik na DIJELJENOM Postgresu — host = ime shared kontejnera
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${TEAM_DB_NAME};Username=${TEAM_DB_USER};Password=${TEAM_DB_PASSWORD}"
      # Keycloak (validacija JWT-a): Authority = JAVNI issuer (iss check + discovery preko nginx-a)
      Keycloak__Authority: "https://auth.${BASE_DOMAIN}/realms/tim3"
      Keycloak__Audience: "praksa-api"
      Keycloak__Realm: "tim3"
      Keycloak__RequireHttpsMetadata: "true"
      # CORS — jedini dozvoljeni origin je naš web preko subdomena
      AllowedOrigins__0: "https://tim3.${BASE_DOMAIN}"
      # Keycloak admin (role-sync) — INTERNI backchannel po imenu shared kontejnera
      KeycloakAdmin__BaseUrl: "http://keycloak:8080"
      KeycloakAdmin__Realm: "tim3"
      KeycloakAdmin__ClientId: "praksa-api"
      KeycloakAdmin__ClientSecret: ${KEYCLOAK_API_CLIENT_SECRET}
    mem_limit: 512m
    networks: [ shared-infra ]

  tim3_web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: tim3_web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_gcServer: "0"                              # ⭐ OBAVEZNO — ~470MB -> ~110MB po web kontejneru
      BackendApiUri: "http://tim3_api:8080"             # web -> api interno, po prefiksu
      # OIDC: Authority = JAVNI URL (browser redirect + iss); KeycloakInternalUrl = interni discovery
      OpenIDConnectSettings__Authority: "https://auth.${BASE_DOMAIN}/realms/tim3"
      KeycloakInternalUrl: "http://keycloak:8080/realms/tim3"
      OpenIDConnectSettings__ClientId: "praksa-web"
      OpenIDConnectSettings__ClientSecret: ${KEYCLOAK_WEB_CLIENT_SECRET}
      OpenIDConnectSettings__RequireHttpsMetadata: "false"
    mem_limit: 512m
    # ports: NE objavljujemo — nginx fronta preko shared-infra
    volumes:
      - tim3_dataprotection_keys:/keys                 # .NET DataProtection — cookie-ji prežive restart (ARHITEKTURA §4.2)
    depends_on: [ tim3_api ]
    networks: [ shared-infra ]

volumes:
  tim3_dataprotection_keys:

networks:
  shared-infra:
    external: true
